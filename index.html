<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f4">
  <title>A Little Hello</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #433b45;
      --muted: #786d78;
      --rose: #c46f83;
      --rose-dark: #a9546a;
      --paper: #fffdfb;
      --blush: #fff0f1;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 18%, #f9e3e5 0 5%, transparent 5.2%),
        radial-gradient(circle at 88% 82%, #f5e8d9 0 7%, transparent 7.2%),
        #fff8f4;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    main {
      width: min(100%, 520px);
      padding: clamp(30px, 7vw, 56px);
      text-align: center;
      background: var(--paper);
      border: 1px solid #f3e6e2;
      border-radius: 28px;
      box-shadow: 0 18px 55px rgb(95 63 69 / 10%);
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--rose-dark);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 9vw, 3.7rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 1.08;
    }

    .intro {
      max-width: 34ch;
      margin: 20px auto 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.75;
    }

    .about {
      margin: 0 auto 28px;
      padding: 18px 20px;
      background: var(--blush);
      border: 1px solid #f5dfe4;
      border-radius: 18px;
      text-align: left;
    }

    .about h2 {
      margin: 0 0 8px;
      color: var(--rose-dark);
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .about p {
      margin: 0;
      color: var(--ink);
      font-size: 1rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      color: white;
      background: var(--rose);
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 650;
      text-decoration: none;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    a:hover { background: var(--rose-dark); transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #e7a9b6; outline-offset: 4px; }

    .note {
      margin: 30px 0 0;
      color: #9b8d96;
      font-size: 0.83rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little corner of the internet</p>
    <h1>Hello, lovely day.</h1>
    <p class="intro">This is a small, cozy place to pause, take a breath, and enjoy the moment.</p>

    <section class="about" aria-label="About me">
      <h2>About</h2>
      <p>My name is Jenny Maatalany and I'm an IT Student at USEK.</p>
    </section>

    <a href="mailto:hello@example.com">Say hello</a>
    <p class="note">Made with a little care.</p>
  </main>
</body>
</html>
